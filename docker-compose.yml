services:
  postgres:
    image: postgres:16-alpine
    container_name: book-lending-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: book_lending
      POSTGRES_USER: book_lending
      POSTGRES_PASSWORD: book_lending
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
